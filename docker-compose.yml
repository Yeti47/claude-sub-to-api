services:
  proxy:
    build: .
    image: claude-sub-to-api:latest
    container_name: claude-sub-to-api
    restart: unless-stopped
    init: true
    # Run as the host user so the bind-mounted Claude config directory (the
    # onboarding file and session transcripts) is writable.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "8080:8080"
    environment:
      LISTEN_ADDR: ":8080"
      PROXY_API_KEY: ${PROXY_API_KEY:?set PROXY_API_KEY in .env}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?set CLAUDE_CODE_OAUTH_TOKEN in .env}
      # Holds .claude.json (onboarding flag) and session transcripts.
      CLAUDE_CONFIG_DIR: "/data"
      LOG_LEVEL: "info"
      MAX_CONCURRENCY: "4"
      REQUEST_TIMEOUT_MS: "900000"
      # A neutral, stable working directory keeps the harness context out of
      # the repository and makes the cached system prompt reusable.
      CLAUDE_CWD: "/data/workspace"
    volumes:
      - ~/.config/claude-sub-to-api:/data

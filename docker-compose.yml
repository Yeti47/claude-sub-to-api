services:
  proxy:
    build: .
    image: claude-sub-to-api:latest
    container_name: claude-sub-to-api
    restart: unless-stopped
    # Run as the host user so the bind-mounted credentials file (owned by you,
    # mode 0600) stays readable and rewritable across token refreshes.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "8080:8080"
    environment:
      LISTEN_ADDR: ":8080"
      UPSTREAM_BASE_URL: "https://api.anthropic.com"
      PROXY_API_KEY: ${PROXY_API_KEY:?set PROXY_API_KEY in .env}
      CREDENTIALS_PATH: "/data/.credentials.json"
      # Serverless alternative: set CLAUDE_CREDENTIALS_JSON to the full
      # credentials JSON and remove the /data volume below.
      # CLAUDE_CREDENTIALS_JSON: ${CLAUDE_CREDENTIALS_JSON:-}
      LOG_LEVEL: "info"
      CLAUDE_UA: "claude-cli/2.1.44"
      # Keep the OAuth token rotated while idle: auto-keepalive forces a real
      # rotation immediately on enable and self-schedules each next rotation
      # from the token's own expiry. AUTO_KEEPALIVE=false by default.
      AUTO_KEEPALIVE: "${AUTO_KEEPALIVE:-false}"
    volumes:
      # Drop your externally-generated .credentials.json into this volume/dir.
      - ~/.config/claude-sub-to-api:/data
